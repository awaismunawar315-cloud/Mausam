<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mausam — Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#2b7fd8}
@property --b{syntax:'<color>';inherits:true;initial-value:#7ec4ff}
:root{--glass:rgba(255,255,255,.14);--bd:rgba(255,255,255,.22);color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(160deg,var(--a),var(--b)) fixed;transition:--a 1.4s,--b 1.4s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1100px;margin:auto;padding:16px 16px 48px}
.bar{display:flex;gap:8px}
.search{flex:1;position:relative}
input{width:100%;padding:14px 20px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:inherit;font-size:1rem;outline:0}
input::placeholder{color:rgba(255,255,255,.7)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ic{width:48px;height:48px;flex:none;border-radius:50%;border:1px solid var(--bd);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font:600 .95rem Outfit,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.ic:hover{background:rgba(255,255,255,.26)}.ic:active{transform:scale(.92)}
#sug{position:absolute;top:56px;left:0;right:0;background:rgba(18,26,44,.94);backdrop-filter:blur(22px);border-radius:20px;overflow:hidden;z-index:5;display:none;box-shadow:0 16px 40px rgba(0,0,0,.35)}
#sug button{display:block;width:100%;text-align:left;padding:12px 20px;background:none;border:0;color:#fff;font:inherit;cursor:pointer}
#sug button:hover,#sug button:focus-visible{background:rgba(255,255,255,.12)}
#sug small{opacity:.65}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--glass);color:#fff;font:inherit;font-size:.9rem;cursor:pointer;backdrop-filter:blur(12px)}
.chip:hover{background:rgba(255,255,255,.26)}
.hero{text-align:center;padding:24px 0 20px}
.city{font-size:1.7rem;font-weight:400}
.country{opacity:.75;font-size:.95rem}
.temp{font-size:min(32vw,9.5rem);font-weight:200;line-height:1;letter-spacing:-.05em;margin:6px 0 0 .3em;text-shadow:0 6px 40px rgba(0,0,0,.18)}
.cond{font-size:1.35rem;font-weight:300}
.hl{opacity:.85;margin-top:4px}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:26px;padding:16px 18px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.12)}
.card h3{font-size:.85rem;font-weight:400;opacity:.78;margin-bottom:10px}
.scroll{overflow-x:auto;scrollbar-width:thin}
.hr{display:flex;width:1536px}
.hr div{width:64px;flex:none;text-align:center;font-size:.9rem}
.hr b{display:block;font-weight:400;font-size:1.15rem;margin:2px 0}
.hr em{display:block;font-style:normal;font-size:.75rem;color:#9fe0ff;height:1em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:12px}
.big{font-size:2.1rem;font-weight:300;line-height:1.1}
.sub{opacity:.78;font-size:.88rem;margin-top:6px}
.day{display:grid;grid-template-columns:64px 34px 40px 1fr 40px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.day:first-of-type{border-top:0}
.day em{font-style:normal;font-size:.72rem;color:#9fe0ff;display:block}
.rng{height:6px;border-radius:9px;background:rgba(255,255,255,.2);position:relative}
.rng i{position:absolute;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#7fd6ff,#ffd36b,#ff8a5c)}
.meter{height:6px;border-radius:9px;margin-top:12px;background:linear-gradient(90deg,#5bd16e,#f2e24a,#f59a3d,#e5484d,#9b5de5);position:relative}
.meter i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.25);transform:translateX(-50%)}
.compass{width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.35);position:relative;margin:4px auto 0}
.compass span{position:absolute;font-size:.7rem;opacity:.8}
.compass .arr{inset:8px;font-size:1.9rem;display:grid;place-items:center;opacity:1;transition:transform 1s}
#msg{text-align:center;padding:40px 10px;font-size:1.1rem}
.star{color:#ffd36b}
@media(max-width:560px){.day{grid-template-columns:54px 30px 36px 1fr 36px}}
.hr div{cursor:pointer;border-radius:14px}.hr div:hover{background:rgba(255,255,255,.12)}
.alert{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:8px;border-radius:20px;background:rgba(255,120,60,.28);border:1px solid rgba(255,190,140,.5);backdrop-filter:blur(18px)}
.alert.ok{background:var(--glass);border-color:var(--bd)}.alert span{font-size:1.6rem}
.note{display:block;opacity:.65;margin:-2px 0 6px 8px}
#map{height:380px;border-radius:18px;overflow:hidden;background:#1a2230}
.rctl{display:flex;align-items:center;gap:12px;margin-top:10px}.rctl .ic{width:40px;height:40px}
dialog{margin:auto;border:1px solid var(--bd);border-radius:28px;background:rgba(18,26,44,.94);backdrop-filter:blur(24px);color:#fff;padding:22px;width:min(92vw,520px);max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
#dx{position:absolute;top:12px;right:12px;width:36px;height:36px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.cmp button{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:20px;border:1px solid var(--bd);background:var(--glass);color:#fff;font:inherit;cursor:pointer}
.cmp button:hover{background:rgba(255,255,255,.22)}
body.ur{font-family:'Noto Naskh Arabic',Outfit,serif;line-height:1.7}
@media(max-width:560px){.bar{flex-wrap:wrap}.search{flex:1 1 100%}.ic{width:42px;height:42px}}
.meta{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:.85rem;opacity:.95}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.tabs button{flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--bd);background:none;color:#fff;font:inherit;font-size:.85rem;cursor:pointer}
.tabs button.on{background:rgba(255,255,255,.3)}
.act{display:grid;grid-template-columns:30px 1fr 64px;gap:8px;align-items:center;padding:7px 0}
.act i{display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.2);position:relative;overflow:hidden;margin-top:4px}
.act i b{position:absolute;inset:0 auto 0 0;border-radius:9px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));column-gap:22px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="bar">
    <div class="search">
      <input id="q" type="search" placeholder="Search any city, town or village…" autocomplete="off" aria-label="Search location">
      <div id="sug"></div>
    </div>
    <button class="ic" id="gps" title="My location" aria-label="Use my location">📍</button>
    <button class="ic" id="save" title="Save location" aria-label="Save location">☆</button>
    <button class="ic" id="unit" title="Switch units" aria-label="Switch units">°C</button>
    <button class="ic" id="cmp" title="Compare locations" aria-label="Compare locations">⚖️</button>
    <button class="ic" id="lng" title="Language" aria-label="Language">اردو</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="msg">Loading weather…</div>
  <main id="app" hidden>
    <section class="hero">
      <div class="city" id="city"></div><div class="country" id="country"></div>
      <div class="temp" id="temp"></div>
      <div class="cond" id="cond"></div><div class="hl" id="hl"></div>
      <div class="cond" id="outlook" style="font-size:1.05rem;margin-top:8px"></div>
      <div class="meta"><span id="upd"></span><button class="chip" id="rf">⟳ Refresh</button><button class="chip" id="sh">📤 Share</button><button class="chip" id="sp">🔊 Speak</button></div>
    </section>
    <div id="alerts"></div>
    <section class="card"><h3>Hourly forecast · next 24 hours</h3>
      <div class="scroll"><div class="hr" id="hr"></div><div id="chart"></div></div></section>
    <section class="card" style="margin-top:12px"><h3>10-day forecast</h3><div id="days"></div></section>
    <div class="grid" id="tiles"></div>
    <section class="card" style="margin-top:12px"><h3>Hourly graph · next 48 hours</h3><div class="tabs" id="gtabs"><button data-m="temp">🌡️ Temperature</button><button data-m="rain">🌧️ Rain chance</button><button data-m="wind">💨 Wind</button><button data-m="hum">💧 Humidity</button><button data-m="uv">☀️ UV</button><button data-m="cloud">☁️ Clouds</button></div><div id="gsvg"></div></section>
    <div class="grid" id="tiles2"></div>
    <section class="card" style="margin-top:12px"><h3>Rain map</h3><div id="map"></div><div class="rctl"><button class="ic" id="rp" aria-label="Play or pause radar">▶</button><span id="rt"></span></div></section>
    <dialog id="dlg"><button class="ic" id="dx" aria-label="Close">✕</button><div id="dbody"></div></dialog>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let unit=st.get('u','C'),loc=st.get('loc',{n:'Faisalabad',c:'Pakistan',lat:31.4504,lon:73.1349}),saved=st.get('saved',[]),D=null,AQ=null;
const imp=()=>unit==='F';
const T=c=>Math.round(imp()?c*9/5+32:c)+'°';
const SP=k=>imp()?Math.round(k*.6214)+' mph':Math.round(k)+' km/h';
const MM=m=>imp()?(m/25.4).toFixed(2)+' in':m.toFixed(1)+' mm';
const VI=m=>imp()?(m/1609.34).toFixed(1)+' mi':(m/1000).toFixed(1)+' km';
const PR=h=>imp()?(h*.02953).toFixed(2)+' inHg':Math.round(h)+' hPa';
const WX={0:['☀️','Clear sky'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Freezing fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Light showers'],81:['🌧️','Showers'],82:['⛈️','Violent showers'],85:['🌨️','Snow showers'],86:['❄️','Heavy snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm, hail'],99:['⛈️','Severe thunderstorm']};
const icon=(c,day=1)=>(!day&&c<3?['🌙','🌙','☁️'][c]:(WX[c]||['❓'])[0]);
const kind=c=>c<2?'clear':c<4?'cloud':c<50?'fog':c<70||(c>=80&&c<83)?'rain':c<80||c>=85&&c<90?'snow':'storm';
const THEME={clear:[['#1f78d1','#7cc6ff'],['#070d2b','#27407f']],cloud:[['#566f88','#a6b8ca'],['#171f2e','#3b4a60']],fog:[['#78858f','#bcc5cb'],['#1c242c','#4a5662']],rain:[['#34475e','#7289a1'],['#0e1622','#2a384b']],snow:[['#7893b0','#dfe8f3'],['#1d2a40','#586f8e']],storm:[['#1d2033','#56567a'],['#0a0b17','#2f3050']]};
const tm=s=>new Date(s);
const hm=s=>tm(s).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const compass=d=>['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];

async function load(l){
  loc=l;st.set('loc',l);$('#msg').hidden=false;$('#msg').textContent='Loading weather…';
  const f=`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&timezone=auto&forecast_days=10`+
   `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m,dew_point_2m`+
   `&hourly=temperature_2m,precipitation_probability,weather_code,visibility,is_day,apparent_temperature,relative_humidity_2m,wind_speed_10m,uv_index,precipitation,cloud_cover,soil_temperature_6cm,soil_moisture_3_to_9cm`+
   `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,daylight_duration,et0_fao_evapotranspiration`;
  const a=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${l.lat}&longitude=${l.lon}&current=us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,dust`;
  try{
    const [r1,r2]=await Promise.allSettled([fetch(f).then(r=>{if(!r.ok)throw 0;return r.json()}),fetch(a).then(r=>r.json())]);
    if(r1.status!=='fulfilled')throw 0;
    D=r1.value;AQ=r2.status==='fulfilled'?r2.value.current:null;UPD=Date.now();OFF=false;
    st.set('cache',{k:l.lat+','+l.lon,D,AQ,t:UPD});
    $('#msg').hidden=true;$('#app').hidden=false;render();
  }catch{
    const ch=st.get('cache',null);
    if(ch&&ch.k===l.lat+','+l.lon){D=ch.D;AQ=ch.AQ;UPD=ch.t;OFF=true;$('#msg').hidden=true;$('#app').hidden=false;render();return}
    $('#msg').hidden=false;$('#app').hidden=true;$('#msg').textContent='Could not load weather. Check your internet connection and try again.'}
}

function render(){
  const c=D.current,h=D.hourly,d=D.daily,day=c.is_day;
  const i=Math.max(0,h.time.findIndex(t=>t.startsWith(c.time.slice(0,13))));
  const k=kind(c.weather_code),th=THEME[k][day?0:1];
  document.body.style.setProperty('--a',th[0]);document.body.style.setProperty('--b',th[1]);
  fx(k==='clear'&&!day?'stars':k,day);
  document.title=`${T(c.temperature_2m)} ${loc.n} — Mausam`;
  $('#city').textContent=loc.n;$('#country').textContent=loc.c||'';
  $('#temp').textContent=T(c.temperature_2m);
  $('#cond').textContent=`${icon(c.weather_code,day)} ${(WX[c.weather_code]||['','Unknown'])[1]}`;
  $('#hl').textContent=`H:${T(d.temperature_2m_max[0])}  L:${T(d.temperature_2m_min[0])} · Feels like ${T(c.apparent_temperature)}`;
  $('#unit').textContent='°'+unit;
  const isSaved=saved.some(s=>s.lat===loc.lat&&s.lon===loc.lon);$('#save').textContent=isSaved?'★':'☆';$('#save').classList.toggle('star',isSaved);
  // hourly
  const idx=[...Array(24).keys()].map(n=>i+n).filter(n=>n<h.time.length);
  $('#hr').innerHTML=idx.map((n,j)=>`<div data-n="${n}" tabindex="0" role="button">${j?tm(h.time[n]).toLocaleTimeString([], {hour:'numeric'}):'Now'}<b>${icon(h.weather_code[n],h.is_day[n])}</b><em>${h.precipitation_probability[n]>=10?h.precipitation_probability[n]+'%':''}</em>${T(h.temperature_2m[n])}</div>`).join('');
  const ts=idx.map(n=>h.temperature_2m[n]),mn=Math.min(...ts),mx=Math.max(...ts),H=90;
  const pts=ts.map((v,j)=>[j*64+32,10+(mx===mn?.5:1-(v-mn)/(mx-mn))*(H-30)]);
  $('#chart').innerHTML=`<svg width="${ts.length*64}" height="${H}" role="img" aria-label="Hourly temperature chart"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M${pts.map(p=>p.join(',')).join(' L')} L${pts.at(-1)[0]},${H} L${pts[0][0]},${H}Z" fill="url(#g)"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff"/>`).join('')}</svg>`;
  // daily
  const gmin=Math.min(...d.temperature_2m_min),gmax=Math.max(...d.temperature_2m_max);
  $('#days').innerHTML=d.time.map((t,j)=>{const lo=d.temperature_2m_min[j],hi=d.temperature_2m_max[j],p=d.precipitation_probability_max[j];
    return `<div class="day"><span>${j?new Date(t+'T00:00').toLocaleDateString('en',{weekday:'short'}):'Today'}</span><span>${icon(d.weather_code[j])}${p>=20?`<em>${p}%</em>`:''}</span><span style="opacity:.75;text-align:right">${T(lo)}</span><div class="rng"><i style="left:${(lo-gmin)/(gmax-gmin)*100}%;width:${Math.max(6,(hi-lo)/(gmax-gmin)*100)}%"></i></div><span>${T(hi)}</span></div>`}).join('');
  // tiles
  const uv=d.uv_index_max[0],uvL=uv<3?'Low':uv<6?'Moderate':uv<8?'High':uv<11?'Very high':'Extreme';
  const sr=tm(d.sunrise[0]),ss=tm(d.sunset[0]),nw=tm(c.time),t=Math.min(1,Math.max(0,(nw-sr)/(ss-sr)));
  const sx=100-90*Math.cos(Math.PI*t),sy=100-90*Math.sin(Math.PI*t);
  const jd=nw.getTime()/864e5+2440587.5,ph=(((jd-2451550.1)/29.530588853)%1+1)%1,mi=Math.round(ph*8)%8;
  const moonN=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'][mi];
  const dew=c.dew_point_2m,hum=c.relative_humidity_2m,aq=AQ&&AQ.us_aqi,aqL=aq==null?'':aq<=50?'Good':aq<=100?'Moderate':aq<=150?'Unhealthy for sensitive groups':aq<=200?'Unhealthy':aq<=300?'Very unhealthy':'Hazardous';
  const vis=h.visibility[i];
  const tile=(t,b,s,x='')=>`<div class="card"><h3>${t}</h3><div class="big">${b}</div><div class="sub">${s}</div>${x}</div>`;
  $('#tiles').innerHTML=[
    tile('🌡️ Feels like',T(c.apparent_temperature),Math.abs(c.apparent_temperature-c.temperature_2m)<2?'Similar to the actual temperature':c.apparent_temperature>c.temperature_2m?'Humidity makes it feel warmer':'Wind makes it feel cooler'),
    tile('☀️ UV index',uv.toFixed(0),uvL,`<div class="meter"><i style="left:${Math.min(100,uv/12*100)}%"></i></div>`),
    `<div class="card"><h3>💨 Wind</h3><div class="compass"><span style="top:2px;left:50%;transform:translateX(-50%)">N</span><span style="bottom:2px;left:50%;transform:translateX(-50%)">S</span><span style="left:6px;top:42%">W</span><span style="right:6px;top:42%">E</span><span class="arr" style="transform:rotate(${c.wind_direction_10m+180}deg)">↑</span></div><div class="sub" style="text-align:center">${SP(c.wind_speed_10m)} from ${compass(c.wind_direction_10m)} · gusts ${SP(c.wind_gusts_10m)}</div></div>`,
    `<div class="card"><h3>🌅 Sunrise & sunset</h3><svg viewBox="0 0 200 118" width="100%"><path d="M10,100 A90,90 0 0 1 190,100" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="4 5"/><line x1="0" y1="100" x2="200" y2="100" stroke="rgba(255,255,255,.4)"/><circle cx="${sx}" cy="${sy}" r="8" fill="#ffd36b" stroke="#fff" stroke-width="2"/></svg><div class="sub" style="display:flex;justify-content:space-between"><span>↑ ${hm(d.sunrise[0])}</span><span>↓ ${hm(d.sunset[0])}</span></div></div>`,
    tile('🌧️ Precipitation',MM(d.precipitation_sum[0]),`Today · ${d.precipitation_probability_max[0]}% chance · now ${MM(c.precipitation)}`),
    tile('💧 Humidity',hum+'%',`Dew point is ${T(dew)}`,`<div class="meter" style="background:rgba(255,255,255,.2)"><i style="left:${hum}%"></i></div>`),
    tile('🍃 Air quality',aq==null?'—':aq,aq==null?'Not available here':aqL+(AQ.pm2_5!=null?` · PM2.5 ${AQ.pm2_5} µg/m³`:''),aq==null?'':`<div class="meter"><i style="left:${Math.min(100,aq/300*100)}%"></i></div>`),
    tile('👁️ Visibility',vis==null?'—':VI(vis),vis>=10000?'Clear view':vis>=4000?'Slightly hazy':'Reduced visibility'),
    tile('🧭 Pressure',PR(c.pressure_msl),'Sea level'),

// particles
const cv=$('#fx'),cx=cv.getContext('2d');let ps=[],mode='';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',size);size();
function fx(k,day){
  mode=k;if(reduce){mode='';return}
  const n=k==='rain'?140:k==='storm'?220:k==='snow'?100:k==='stars'?90:k==='clear'&&day?0:0;
  ps=[...Array(n)].map(()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random(),p:Math.random()*6}));
}
let fl=0;
(function loop(t=0){
  cx.clearRect(0,0,cv.width,cv.height);
  for(const p of ps){
    if(mode==='rain'||mode==='storm'){
      cx.strokeStyle='rgba(200,225,255,.45)';cx.lineWidth=1;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-3,p.y+10+p.s*10);cx.stroke();
      p.y+=10+p.s*12;p.x-=1.5;if(p.y>cv.height){p.y=-20;p.x=Math.random()*cv.width+30}
    }else if(mode==='snow'){
      cx.fillStyle='rgba(255,255,255,.85)';cx.beginPath();cx.arc(p.x,p.y,1.5+p.s*2.5,0,7);cx.fill();
      p.y+=.7+p.s*1.4;p.x+=Math.sin(t/900+p.p)*.5;if(p.y>cv.height){p.y=-10;p.x=Math.random()*cv.width}
    }else if(mode==='stars'){
      cx.fillStyle=`rgba(255,255,255,${.35+.65*Math.abs(Math.sin(t/1200+p.p))})`;cx.fillRect(p.x,p.y*.8,1+p.s*1.5,1+p.s*1.5);
    }
  }
  if(mode==='storm'&&Math.random()<.004)fl=1;
  if(fl>0){cx.fillStyle=`rgba(255,255,255,${fl*.35})`;cx.fillRect(0,0,cv.width,cv.height);fl-=.06}
  requestAnimationFrame(loop);
})();

function tru(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.tagName==='SCRIPT'?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;
  while(n=w.nextNode()){
    if(n._o===undefined)n._o=n.nodeValue;
    let t=n._o;
    if(lang==='ur'&&t.trim()){
      const pre=t.match(/^[^A-Za-z]*/)[0],core=t.slice(pre.length).trim();
      if(UR[core])t=pre+UR[core];
      else for(const k in UR)if(k.length>4&&t.includes(k))t=t.split(k).join(UR[k]);
    }
    if(n.nodeValue!==t)n.nodeValue=t;
  }

// ---------- Alerts ----------
function alerts(){
  const c=D.current,d=D.daily,h=D.hourly,A=[];
  const i=Math.max(0,h.time.findIndex(t=>t.startsWith(c.time.slice(0,13))));
  const hi=d.temperature_2m_max[0],lo=d.temperature_2m_min[0];
  if(hi>=40)A.push(['🔥','Extreme heat warning','Avoid the sun from noon to 4 PM and drink plenty of water.']);
  else if(hi>=36)A.push(['🌡️','Heat advisory','Very hot today. Stay hydrated and take breaks in the shade.']);
  if(lo<=2)A.push(['🥶','Cold or frost warning','Near-freezing night. Dress warmly and protect plants.']);
  if(h.weather_code.slice(i,i+24).some(x=>x>=95))A.push(['⛈️','Thunderstorm expected','Stay indoors during lightning and avoid open areas.']);
  if(d.precipitation_probability_max[0]>=70||d.precipitation_sum[0]>=20)A.push(['🌧️','Heavy rain likely','Expect waterlogging. Leave early and drive carefully.']);
  if(c.wind_gusts_10m>=50||d.wind_speed_10m_max[0]>=50)A.push(['💨','Strong winds','Secure loose objects outdoors.']);
  if(AQ&&AQ.us_aqi>150)A.push(['😷','Poor air quality','Limit outdoor activity and consider a mask.']);
  if(d.uv_index_max[0]>=8)A.push(['🧴','Very high UV','Use sunscreen and a cap or umbrella.']);
  if(h.visibility[i]<1000)A.push(['🌫️','Dense fog','Visibility is low. Drive slowly with low-beam lights.']);
  $('#alerts').innerHTML=A.length?A.map(a=>`<div class="alert"><span>${a[0]}</span><div><b>${a[1]}</b><br>${a[2]}</div></div>`).join('')+'<small class="note">Based on forecast data, not official alerts.</small>'
   :`<div class="alert ok"><span>✅</span><div><b>No weather warnings</b><br>Nothing unusual in today's forecast.</div></div>`;
}

function wear(c,d,h,i,uv){

  const x=[];if(p>=40)x.push('Take an umbrella');if(uv>=6&&c.is_day)x.push('Sunscreen and a cap');if(c.wind_gusts_10m>=40)x.push('A windproof layer');

}

function graph(i){
  const h=D.hourly,[get,fmt,bar]=GM[gm],vals=get(h).slice(i,i+48),mx=Math.max(...vals,bar?1:-1e9),mn=bar?0:Math.min(...vals),W=960,H=170,P=28,sx=W/vals.length;
  const y=v=>P+(1-(mx===mn?.5:(v-mn)/(mx-mn)))*(H-P-26);
  let s=bar?vals.map((v,k)=>`<rect x="${k*sx+3}" y="${y(v)}" width="${sx-6}" height="${H-26-y(v)}" rx="4" fill="rgba(255,255,255,.6)"/>`).join(''):`<polyline points="${vals.map((v,k)=>`${k*sx+sx/2},${y(v)}`).join(' ')}" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`;
  s+=vals.map((v,k)=>k%6===0?`<text x="${k*sx+sx/2}" y="${H-6}" fill="#fff" font-size="13" text-anchor="middle" opacity=".8">${k?tm(h.time[i+k]).toLocaleTimeString([], {hour:'numeric'}):'Now'}</text><text x="${k*sx+sx/2}" y="${y(v)-8}" fill="#fff" font-size="14" text-anchor="middle">${fmt(v)}</text>`:'').join('');

function more(){
  const c=D.current,h=D.hourly,d=D.daily,day=c.is_day;
  const i=HI=Math.max(0,h.time.findIndex(t=>t.startsWith(c.time.slice(0,13))));
  const pops=h.precipitation_probability.slice(i,i+24);
  const wet=k=>{const x=h.weather_code[i+k];return pops[k]>=50||(x>=51&&x<=67)||x>=80};
  const n0=pops.findIndex((p,k)=>wet(k));
  OUT=c.precipitation>0.1?'Raining now':n0>=0?'Rain likely around '+tm(h.time[i+n0]).toLocaleTimeString([], {hour:'numeric'}):'No rain expected in the next 24 hours';
  $('#outlook').textContent=OUT;
  $('#upd').textContent='Local time '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:D.timezone})+' · '+(OFF?'Offline, saved ':'Updated ')+hmd(new Date(UPD));
  graph(i);
  // scores
  const t=c.apparent_temperature,w=c.wind_speed_10m,hum=c.relative_humidity_2m,pop6=Math.max(...pops.slice(0,6)),pop24=Math.max(...pops),aq=(AQ&&AQ.us_aqi)||0;
  const jd=Date.now()/864e5+2440587.5,il=(1-Math.cos((((jd-2451550.1)/29.530588853)%1+1)%1*2*Math.PI))/2;
  const A=[
   ['🏏','Cricket',clamp(100-Math.max(0,Math.abs(t-25)-7)*5-pop6*.8-Math.max(0,w-22)*2-Math.max(0,aq-100)*.3-(day?0:60))],
   ['🏃','Running',clamp(100-Math.max(0,Math.abs(t-15)-7)*5-pop6*.6-Math.max(0,w-25)*1.5-Math.max(0,aq-50)*.5)],
   ['🚴','Cycling',clamp(100-Math.max(0,Math.abs(t-20)-8)*4-pop6*.7-Math.max(0,w-20)*2.5-Math.max(0,aq-80)*.4)],
   ['🚗','Car wash',clamp(100-pop24*1.1-(w>30?20:0))],
   ['👕','Drying laundry',clamp(60+(t-20)*2-hum*.6-pop6*.8+(100-c.cloud_cover)*.3)],
   ['🔭','Stargazing',clamp(100-c.cloud_cover-il*35-(aq>100?20:0))],
   ['🧺','Picnic',clamp(100-Math.max(0,Math.abs(t-24)-6)*5-pop6-Math.max(0,w-20)*2-(d.uv_index_max[0]>=8?15:0))],
   ['🪁','Kite flying',clamp(100-Math.abs(w-22)*4-pop6)]];
  const act=`<div class="card" style="grid-column:1/-1"><h3>🎯 Outdoor activities</h3><div class="acts">${A.map(([e,n,s])=>`<div class="act"><span style="font-size:1.4rem">${e}</span><div>${n}<i><b style="width:${s}%;background:${s>=75?'#6be08f':s>=50?'#ffd36b':'#ff8a5c'}"></b></i></div><small>${s>=75?'Great':s>=50?'Okay':'Poor'}</small></div>`).join('')}</div></div>`;
  const tl=(t,b,s,x='')=>`<div class="card"><h3>${t}</h3><div class="big">${b}</div><div class="sub">${s}</div>${x}</div>`;
  const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
  // comfort
  const cf=t>=41?'Dangerous heat':t>=35?'Very hot':t>=29?'Hot':t>=24?'Warm':t>=17?'Pleasant':t>=10?'Cool':t>=0?'Cold':'Freezing';
  const bf=['Calm','Light air','Light breeze','Gentle breeze','Moderate breeze','Fresh breeze','Strong breeze','Near gale','Gale'][[1,6,12,20,29,39,50,62].filter(x=>w>=x).length];
  const dw=c.dew_point_2m,mug=dw>=21?'Sticky air':dw>=16?'Humid air':'Comfortable air';
  const comfort=tl('😌 Comfort',cf,`${bf} · ${mug}`);
  // daylight
  const sr=tm(d.sunrise[0]),ss=tm(d.sunset[0]),dl=d.daylight_duration[0],dd=d.daylight_duration[1]-dl,H1=36e5;
  const dayT=tl('🌇 Daylight',`${Math.floor(dl/3600)}h ${Math.floor(dl%3600/60)}m`,`Tomorrow ${dd>=0?'+':'−'}${Math.floor(Math.abs(dd)/60)}m ${Math.round(Math.abs(dd)%60)}s`,
    '<div style="margin-top:10px">'+kv('Golden hour',`${hmd(sr)} – ${hmd(new Date(+sr+H1))}`)+kv('Golden hour',`${hmd(new Date(+ss-H1))} – ${hmd(ss)}`)+'</div>');
  // AQ details
  const P=AQ||{},pr=(l,v)=>v==null?'':kv(l,Math.round(v)+' µg/m³');
  const adv=aq<=50?'Air is clean. Enjoy outdoor activities.':aq<=100?'Acceptable. Very sensitive people should take it easy outdoors.':aq<=150?'Sensitive groups should limit long outdoor exertion.':'Everyone should reduce outdoor activity. Wear a mask outside.';
  const aqT=AQ?`<div class="card"><h3>🍃 Air quality details</h3><div class="sub" style="margin:0 0 8px">${adv}</div>${pr('PM2.5',P.pm2_5)+pr('PM10',P.pm10)+pr('Dust',P.dust)+pr('Ozone (O₃)',P.ozone)+pr('Nitrogen dioxide',P.nitrogen_dioxide)+pr('Sulphur dioxide',P.sulphur_dioxide)+pr('Carbon monoxide',P.carbon_monoxide)}</div>`:'';
  // farming
  const s6=h.soil_temperature_6cm[i],sm=h.soil_moisture_3_to_9cm[i],et=d.et0_fao_evapotranspiration[0],r3=d.precipitation_sum.slice(0,3).reduce((a,b)=>a+b,0);
  const spray=w<15&&pop6<30&&c.temperature_2m<36;
  const farm=`<div class="card"><h3>🌾 Farming</h3><div style="font-size:1.25rem">${spray?'Good time to spray':'Not ideal for spraying'}</div>${et>=5&&r3<5?'<div class="sub">Crops may need irrigation soon</div>':''}<div style="margin-top:10px">${kv('Soil temperature',s6==null?'—':T(s6))+kv('Soil moisture',sm==null?'—':Math.round(sm*100)+'%')+kv('Water loss (ET₀)',et==null?'—':MM(et))+kv('Rain, next 3 days',MM(r3))}</div></div>`;
  // 10-day summary
  const hi=d.temperature_2m_max,mxi=hi.indexOf(Math.max(...hi)),mni=hi.indexOf(Math.min(...hi)),ps=d.precipitation_sum,pw=ps.indexOf(Math.max(...ps));
  const dn=k=>k?new Date(d.time[k]+'T00:00').toLocaleDateString('en',{weekday:'short'}):'Today';
  const sum10=`<div class="card"><h3>📅 10-day summary</h3>${kv('Hottest day',dn(mxi)+' · '+T(hi[mxi]))+kv('Coolest day',dn(mni)+' · '+T(hi[mni]))+(ps[pw]>0.2?kv('Wettest day',dn(pw)+' · '+MM(ps[pw])):'')}</div>`;
  const uvp=d.uv_index_max[0],sunT=tl('🧴 Sun safety',uvp>=1?Math.round(200/(3*uvp))+' min':'Low risk',uvp>=1?'Approx. minutes to sunburn (fair skin, peak UV)':'No special sun protection needed',uvp>=3?'<div class="sub">Use sunscreen SPF 30+ and a hat</div>':'');
  const ph=(id,t,x='')=>`<div class="card" id="${id}" ${x}><h3>${t}</h3><div class="sub">Loading…</div></div>`;
  $('#tiles2').innerHTML=act+comfort+dayT+sunT+aqT+farm+sum10+ph('hist','📜 Compared with past years')+ph('prayer','🕌 Prayer times')+ph('river','🌊 River flow')+ph('quake','🌍 Nearby earthquakes')+ph('past','📈 Past 30 days','style="grid-column:1/-1"');
  hist();prayer();river();quake();past();
}

async function hist(){
  const key=loc.lat+','+loc.lon,t0=D.daily.time[0];
  const yrs=[1,2,3,4,5].map(n=>{const x=new Date(t0+'T00:00:00Z');x.setUTCFullYear(x.getUTCFullYear()-n);return x.toISOString().slice(0,10)});
  try{
    const rs=await Promise.all(yrs.map(y=>fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${y}&end_date=${y}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`).then(r=>r.json()).catch(()=>null)));
    if(key!==loc.lat+','+loc.lon||!$('#hist'))return;
    const ok=rs.filter(r=>r&&r.daily&&r.daily.temperature_2m_max&&r.daily.temperature_2m_max[0]!=null);
    if(!ok.length)throw 0;
    const avg=ok.reduce((a,r)=>a+r.daily.temperature_2m_max[0],0)/ok.length,diff=D.daily.temperature_2m_max[0]-avg,ly=rs[0]&&rs[0].daily&&rs[0].daily.temperature_2m_max&&rs[0].daily.temperature_2m_max[0]!=null?rs[0].daily:null;
    const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
    $('#hist').innerHTML=`<h3>📜 Compared with past years</h3><div class="big">${diff>=0?'+':'−'}${Math.abs(imp()?diff*1.8:diff).toFixed(1)}°</div><div class="sub" style="margin-bottom:8px">${Math.abs(diff)<1?'About normal for this date':diff>0?'Warmer than average':'Cooler than average'}</div>`+kv('Typical high',T(avg))+(ly?kv('Same day last year',`${T(ly.temperature_2m_max[0])} / ${T(ly.temperature_2m_min[0])} · ${MM(ly.precipitation_sum[0]||0)}`):'');
  }catch{if($('#hist'))$('#hist').innerHTML='<h3>📜 Compared with past years</h3><div class="sub">Past data is not available right now.</div>'}
  if($('#hist'))tru($('#hist'));
}

Object.assign(UR,{'Sun safety':'دھوپ سے بچاؤ','Approx. minutes to sunburn (fair skin, peak UV)':'دھوپ سے جلنے میں تقریباً منٹ (گوری جلد، تیز دھوپ)','Use sunscreen SPF 30+ and a hat':'SPF 30+ سن اسکرین اور ٹوپی استعمال کریں','No special sun protection needed':'خاص حفاظت کی ضرورت نہیں','Low risk':'کم خطرہ','Prayer times':'نماز کے اوقات','Fajr':'فجر','Dhuhr':'ظہر','Asr':'عصر','Maghrib':'مغرب','Isha':'عشاء','Next:':'اگلی:','River flow':'دریا کا بہاؤ','Peak this week':'اس ہفتے کی بلند ترین سطح','Normal':'معمول','Dust':'دھول','Nearby earthquakes':'قریبی زلزلے','Last 30 days, within 600 km, magnitude 2.5+':'پچھلے 30 دن، 600 کلومیٹر کے اندر، شدت 2.5+','No earthquakes recorded nearby in this period.':'اس مدت میں قریب کوئی زلزلہ ریکارڈ نہیں ہوا۔','Past 30 days':'پچھلے 30 دن','Not available right now.':'ابھی دستیاب نہیں۔','No river near this location, or data not available.':'اس مقام کے قریب دریا نہیں، یا ڈیٹا دستیاب نہیں۔'});
const same=k=>k===loc.lat+','+loc.lon,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kvh=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
function cardH(id,t,body){const e=$('#'+id);if(e){e.innerHTML=`<h3>${t}</h3>`+body;tru(e)}}
async function prayer(){
  const key=loc.lat+','+loc.lon;
  try{
    const j=await fetch(`https://api.aladhan.com/v1/timings?latitude=${loc.lat}&longitude=${loc.lon}&method=1&school=1`).then(r=>r.json());
    if(!same(key))return;
    const t=j.data.timings,hj=j.data.date.hijri,names=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
    const now=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:D.timezone});
    const nx=names.find(n=>t[n].slice(0,5)>now)||'Fajr';
    const f=x=>{const h=+x.slice(0,2);return `${h%12||12}:${x.slice(3,5)} ${h<12?'AM':'PM'}`};
    cardH('prayer','🕌 Prayer times',names.map(n=>`<div class="kv"${n===nx?' style="background:rgba(255,255,255,.14);border-radius:10px;padding-left:8px;padding-right:8px"':''}><span>${n}</span><b>${f(t[n])}</b></div>`).join('')+`<div class="sub" style="margin-top:8px">${esc(hj.day)} ${esc(hj.month.en)} ${esc(hj.year)} AH · Next: ${nx}</div>`);
  }catch{cardH('prayer','🕌 Prayer times','<div class="sub">Not available right now.</div>')}
}
async function river(){
  const key=loc.lat+','+loc.lon;
  try{
    const j=await fetch(`https://flood-api.open-meteo.com/v1/flood?latitude=${loc.lat}&longitude=${loc.lon}&daily=river_discharge,river_discharge_mean&forecast_days=7`).then(r=>r.json());
    if(!same(key))return;
    const q=j.daily.river_discharge,m=j.daily.river_discharge_mean;
    if(!q||q[0]==null)throw 0;
    const ratio=q[0]/(m[0]||1),peak=Math.max(...q.filter(x=>x!=null));
    const lvl=ratio<.5?'Low':ratio<1.5?'Normal':ratio<3?'High':'Very high';
    cardH('river','🌊 River flow',`<div class="big">${Math.round(q[0])} m³/s</div><div class="sub"><span>${lvl}</span> · ${ratio.toFixed(1)}× average${ratio>=3?' · flood risk':''}</div>`+kvh('Peak this week',Math.round(peak)+' m³/s'));
  }catch{cardH('river','🌊 River flow','<div class="sub">No river near this location, or data not available.</div>')}
}
async function quake(){
  const key=loc.lat+','+loc.lon,since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  try{
    const j=await fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=${loc.lat}&longitude=${loc.lon}&maxradiuskm=600&starttime=${since}&minmagnitude=2.5&orderby=time&limit=5`).then(r=>r.json());
    if(!same(key))return;
    const f=j.features||[];
    cardH('quake','🌍 Nearby earthquakes','<div class="sub" style="margin:0 0 6px">Last 30 days, within 600 km, magnitude 2.5+</div>'+(f.length?f.map(e=>{const p=e.properties;return kvh('M'+Number(p.mag).toFixed(1)+' · '+esc(p.place),new Date(p.time).toLocaleDateString([], {day:'numeric',month:'short'}))}).join(''):'<div class="sub">No earthquakes recorded nearby in this period.</div>'));
  }catch{cardH('quake','🌍 Nearby earthquakes','<div class="sub">Not available right now.</div>')}
}
async function past(){
  const key=loc.lat+','+loc.lon,fd=x=>x.toISOString().slice(0,10);
  try{
    const j=await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${loc.lat}&longitude=${loc.lon}&start_date=${fd(new Date(Date.now()-37*864e5))}&end_date=${fd(new Date(Date.now()-7*864e5))}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto`).then(r=>r.json());
    if(!same(key))return;
    const d=j.daily,n=d.time.length,W=960,H=180,sx=W/n,all=[...d.temperature_2m_max,...d.temperature_2m_min].filter(x=>x!=null),mx=Math.max(...all),mn=Math.min(...all),pm=Math.max(...d.precipitation_sum.filter(x=>x!=null),1);
    const y=v=>16+(1-((v??mn)-mn)/((mx-mn)||1))*(H-96),ln=a=>a.map((v,k)=>`${k*sx+sx/2},${y(v)}`).join(' ');
    const bars=d.precipitation_sum.map((v,k)=>`<rect x="${k*sx+3}" y="${H-26-((v||0)/pm)*34}" width="${sx-6}" height="${((v||0)/pm)*34}" rx="3" fill="#7fd6ff" opacity=".85"/>`).join('');
    const dt=x=>new Date(x+'T00:00').toLocaleDateString([], {day:'numeric',month:'short'}),tot=d.precipitation_sum.reduce((a,b)=>a+(b||0),0);
    cardH('past','📈 Past 30 days',`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Past 30 days"><polyline points="${ln(d.temperature_2m_max)}" fill="none" stroke="#ffb36b" stroke-width="3" stroke-linejoin="round"/><polyline points="${ln(d.temperature_2m_min)}" fill="none" stroke="#9fe0ff" stroke-width="3" stroke-linejoin="round"/>${bars}<text x="4" y="12" fill="#fff" font-size="13" opacity=".85">${T(mx)}</text><text x="4" y="${H-8}" fill="#fff" font-size="13" opacity=".85">${dt(d.time[0])}</text><text x="${W-4}" y="${H-8}" text-anchor="end" fill="#fff" font-size="13" opacity=".85">${dt(d.time[n-1])}</text></svg><div class="sub">🟠 high · 🔵 low · bars: rain · total ${MM(tot)}</div>`);
  }catch{cardH('past','📈 Past 30 days','<div class="sub">Not available right now.</div>')}
}
